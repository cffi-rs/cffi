[package]
name = "cffi"
description = "Safe* C FFI interface generation"
version = "0.2.0-dev"
authors = [
  "Brendan Molloy <brendan@bbqsrc.net>",
  "Pascal Hertleif <pascal@technocreatives.com>"
]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/cffi-rs/cffi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cffi-impl = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, optional = true }

[features]
default = []

[workspace]
members = ["impl"]

[workspace.dependencies]
cffi-impl = { version = "=0.2.0-dev", path = "./impl" }
libc = "0.2.191"
log = "0.4.35"
tracing = "0.1.44"
url = "2.5.8"
syn = { version = "3.0.9", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
darling = "0.24.1"
heck = "0.5.0"
phf = "0.14.0"
phf_codegen = "0.14.0"
